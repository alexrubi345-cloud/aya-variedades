<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A y A Variedades y Más</title>
<style>
:root {
  --pink: #e7d7d2;
  --pink-d: #7a3b3f;
  --sage: #d9e0d6;
  --sage-d: #3f5d54;
  --lav: #dde2ea;
  --lav-d: #2c3e50;
  --gold: #b8902f;
  --bg: #f7f3ec;
  --card: #ffffff;
  --text: #2b2622;
  --text-soft: #7d7368;
  --border: #e3dcd2;
  --danger: #a2504f;
  --radius: 10px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #201c1a; --card: #2a2422; --text: #f1ebe4; --text-soft: #b0a89e; --border: #3d352f;
    --pink: #40282b; --sage: #253128; --lav: #202836;
  }
}
:root[data-theme="dark"] {
  --bg: #201c1a; --card: #2a2422; --text: #f1ebe4; --text-soft: #b0a89e; --border: #3d352f;
  --pink: #40282b; --sage: #253128; --lav: #202836;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.5;
  transition: background .3s ease;
}
body.view-store { background: linear-gradient(180deg, var(--pink) 0%, var(--lav) 340px, var(--bg) 340px); }
body.view-admin { background: linear-gradient(180deg, var(--sage) 0%, var(--bg) 260px); }
body.view-store .topbar, body.view-admin .topbar { background: transparent; border-bottom: 1px solid rgba(0,0,0,.06); }
.store-banner { background: var(--card); border-radius: var(--radius); padding: 16px 18px; margin-top: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
.store-banner h2 { color: var(--pink-d); }
.admin-banner { background: var(--lav-d); color: #fff; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.admin-banner .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; display: inline-block; }
h1,h2,h3 { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; margin: 0 0 4px; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }
.wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 80px; overflow-x: hidden; }

/* header */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-badge { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--pink), var(--lav)); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--pink-d); flex-shrink: 0; }
.brand-name { font-size: 15px; font-weight: 700; color: var(--text); }
.brand-sub { font-size: 11px; color: var(--text-soft); letter-spacing: 1px; }
.tabs { display: flex; gap: 6px; }
.tab-btn { padding: 8px 14px; border-radius: 999px; background: transparent; color: var(--text-soft); font-size: 13px; font-weight: 500; }
.tab-btn.active { background: var(--sage); color: var(--sage-d); }
.cart-btn { position: relative; background: var(--pink); color: var(--pink-d); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
.cart-count { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; }

/* product grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 18px; }
.pcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.pimg { width: 100%; aspect-ratio: 1; background: var(--sage); display: flex; align-items: center; justify-content: center; color: var(--text-soft); font-size: 12px; overflow: hidden; }
.pimg img { width: 100%; height: 100%; object-fit: cover; }
.pbody { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.pname { font-size: 13.5px; font-weight: 600; }
.pcat { font-size: 11px; color: var(--text-soft); }
.pprice { font-size: 15px; font-weight: 700; color: var(--pink-d); margin-top: auto; }
.pstock { font-size: 11px; color: var(--text-soft); }
.addbtn { margin-top: 4px; background: var(--sage); color: var(--sage-d); border-radius: 10px; padding: 7px; font-size: 12.5px; font-weight: 600; text-align: center; }
.addbtn:disabled { opacity: .5; }

.empty { text-align: center; color: var(--text-soft); padding: 40px 20px; font-size: 14px; }

/* cart drawer */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 30; }
.overlay.show { display: block; }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(360px, 92vw); background: var(--card); z-index: 31; transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer.show { transform: translateX(0); }
.drawer-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.drawer-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
.cart-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.cart-row-name { font-size: 13.5px; font-weight: 600; flex: 1; }
.cart-row-price { font-size: 12px; color: var(--text-soft); }
.qty-ctrl { display: flex; align-items: center; gap: 6px; }
.qty-ctrl button { width: 24px; height: 24px; border-radius: 50%; background: var(--sage); color: var(--sage-d); font-weight: 700; }
.drawer-foot { padding: 16px; border-top: 1px solid var(--border); }
.total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
.btn-primary { width: 100%; background: var(--pink-d); color: #fff; border-radius: 12px; padding: 12px; font-weight: 600; font-size: 14px; }
.btn-primary:disabled { opacity: .5; }
.btn-secondary { width: 100%; background: var(--sage); color: var(--sage-d); border-radius: 12px; padding: 10px; font-weight: 600; font-size: 13px; margin-top: 8px; }
.close-x { background: none; color: var(--text-soft); font-size: 18px; }

/* checkout form */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-soft); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.field textarea { resize: vertical; min-height: 50px; }
.err { color: var(--danger); font-size: 12px; margin-top: 4px; display: none; }

/* admin */
.admin-tabs { display: flex; gap: 8px; margin: 18px 0; }
.admin-tab { padding: 8px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text-soft); }
.admin-tab.active { background: var(--lav); color: var(--lav-d); border-color: transparent; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.prow { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.prow:last-child { border-bottom: none; }
.prow img, .prow .pimg-sm { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--sage); }
.prow-info .n { font-size: 13.5px; font-weight: 600; }
.prow-info .s { font-size: 11.5px; color: var(--text-soft); }
.prow-actions { display: flex; gap: 6px; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); font-size: 13px; color: var(--text-soft); }
.icon-btn.danger { color: var(--danger); }
.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.badge.pend { background: var(--pink); color: var(--pink-d); }
.badge.paid { background: var(--sage); color: var(--sage-d); }
.badge.prog { background: var(--lav); color: var(--lav-d); }
.order-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.order-top { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
.order-items { font-size: 12.5px; color: var(--text-soft); margin: 8px 0; }
.order-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.order-controls select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; }
.addr { font-size: 12.5px; color: var(--text-soft); }
.fab { position: fixed; bottom: 20px; right: 20px; z-index: 25; background: var(--pink-d); color: #fff; border-radius: 999px; padding: 12px 18px; font-weight: 600; font-size: 13.5px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
.lockmsg { text-align: center; padding: 60px 20px; color: var(--text-soft); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--sage-d); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 50; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }
.hidden { display: none !important; }
.mini { font-size: 11px; color: var(--text-soft); }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- intro: letter opening with wax seal ---------- */
.intro-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: linear-gradient(180deg, var(--lav-d) 0%, var(--pink-d) 100%);
  display: flex; align-items: center; justify-content: center;
  perspective: 1200px;
  transition: opacity .7s ease;
}
.intro-overlay.hide { opacity: 0; pointer-events: none; }
.envelope { position: relative; width: 280px; height: 190px; }
.env-body {
  position: absolute; inset: 0; background: var(--card);
  border: 1px solid var(--gold); border-radius: 6px;
  box-shadow: 0 18px 40px rgba(0,0,0,.25); overflow: hidden; z-index: 1;
}
.env-letter {
  position: absolute; left: 9%; right: 9%; top: 12px; height: 82%;
  background: var(--card); border: 1px solid var(--border); border-radius: 4px;
  box-shadow: 0 6px 14px rgba(0,0,0,.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 14px; z-index: 2;
  transform: translateY(12%); opacity: 0;
  transition: transform 1s ease .5s, opacity .8s ease .5s;
}
.envelope.open .env-letter { transform: translateY(-56%); opacity: 1; }
.letter-badge {
  width: 42px; height: 42px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--gold), var(--pink-d) 75%);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; font-family: Georgia, serif; margin-bottom: 8px;
}
.intro-overlay h2 { margin: 4px 0; color: var(--lav-d); font-size: 19px; }
.intro-overlay p { color: var(--text-soft); font-size: 12.5px; margin: 0; }
.env-flap {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  clip-path: polygon(0 0, 100% 0, 50% 58%);
  background: linear-gradient(135deg, var(--lav-d), var(--pink-d));
  transform-origin: top center; z-index: 3;
  transition: transform 1.1s cubic-bezier(.62,-0.2,.3,1.25);
}
.envelope.open .env-flap { transform: rotateX(180deg); }
.seal {
  position: absolute; top: 36%; left: 50%; transform: translate(-50%, -50%);
  width: 58px; height: 58px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--gold), var(--pink-d) 75%);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: Georgia, serif; font-weight: 700; font-size: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.35); z-index: 4;
  transition: opacity .4s ease, transform .4s ease;
}
.seal .sy { font-family: 'Brush Script MT', cursive; font-size: 20px; margin: 0 1px; }
.envelope.open .seal { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
</style>
</head>
<body>
<div class="intro-overlay" id="introOverlay">
  <div class="envelope" id="envelope">
    <div class="env-body"></div>
    <div class="env-letter">
      <div class="letter-badge">A y A</div>
      <h2>Bienvenidos</h2>
      <p>Variedades y más, a tu puerta</p>
    </div>
    <div class="env-flap">
      <div class="seal">A<span class="sy">y</span>A</div>
    </div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">A y A</div>
      <div>
        <div class="brand-name">A y A Variedades y Más</div>
        <div class="brand-sub" id="statusline">cargando…</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="tabs" id="tabs"></div>
      <button class="cart-btn" id="cartBtn">Carrito <span class="cart-count hidden" id="cartCount">0</span></button>
    </div>
  </div>
  <div class="wrap" id="main"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><h3>Tu carrito</h3><button class="close-x" id="closeDrawer">✕</button></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- STANDALONE DATA LAYER (localStorage, per browser) ---------- */
/* Change this passcode before publishing. It only gates the UI in this
   browser — it is not real authentication. For a real multi-device store
   you need a proper backend + login. */
const ADMIN_PASSCODE = 'ayaadmin2026';

let isAdmin = false;
let products = [];
let orders = [];
let cart = [];
let view = 'store';
let adminTab = 'productos';
let editingProduct = null;

function money(n){ return 'L ' + Number(n||0).toFixed(2); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function loadLocal(key, fallback){
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function saveLocal(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){ /* storage unavailable */ }
}
function saveProducts(){ saveLocal('aya_products', products); }
function saveOrders(){ saveLocal('aya_orders', orders); }
function newId(){ return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

function tryAdminUnlock(){
  const code = prompt('Código de administración:');
  if (code === null) return;
  if (code === ADMIN_PASSCODE) {
    isAdmin = true;
    try { sessionStorage.setItem('aya_admin', '1'); } catch(e){}
    view = 'admin';
    renderTabs(); render();
    showToast('Acceso de administración activado');
  } else {
    showToast('Código incorrecto');
  }
}

async function init(){
  products = loadLocal('aya_products', []);
  orders = loadLocal('aya_orders', []);
  try { isAdmin = sessionStorage.getItem('aya_admin') === '1'; } catch(e){ isAdmin = false; }
  renderTabs();
  document.getElementById('statusline').textContent = isAdmin ? 'panel de administración' : 'tienda en línea';
  render();
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  let html = `<button class="tab-btn ${view==='store'?'active':''}" data-tab="store">Tienda</button>`;
  if (isAdmin) html += `<button class="tab-btn ${view==='admin'?'active':''}" data-tab="admin">Administración</button>`;
  else html += `<button class="tab-btn" id="adminUnlock">Administración</button>`;
  tabs.innerHTML = html;
  tabs.querySelectorAll('.tab-btn[data-tab]').forEach(b => b.addEventListener('click', () => { view = b.dataset.tab; renderTabs(); render(); }));
  const unlockBtn = document.getElementById('adminUnlock');
  if (unlockBtn) unlockBtn.addEventListener('click', tryAdminUnlock);
}

function render(){
  document.body.classList.toggle('view-store', view === 'store');
  document.body.classList.toggle('view-admin', view === 'admin');
  if (view === 'store') renderStore(); else renderAdmin();
  renderCart();
}

/* ---------- STORE ---------- */
function renderStore(){
  const main = document.getElementById('main');
  if (!products.length) {
    main.innerHTML = '<div class="store-banner"><h2>Nuestros productos</h2></div><div class="empty">Aún no hay productos publicados. Vuelve pronto.</div>';
    return;
  }
  main.innerHTML = `<div class="store-banner"><h2>Nuestros productos</h2><div class="mini">Variedades, abarrotes y más — entrega a domicilio</div></div><div class="grid">${products.filter(p=>p.active!==false).map(p => `
    <div class="pcard">
      <div class="pimg">${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="${esc(p.name)}">` : 'Sin foto'}</div>
      <div class="pbody">
        <div class="pname">${esc(p.name)}</div>
        ${p.category ? `<div class="pcat">${esc(p.category)}</div>` : ''}
        <div class="pprice">${money(p.price)}</div>
        <div class="pstock">${(p.stock ?? null) !== null ? 'Disponible: ' + p.stock : ''}</div>
        <button class="addbtn" data-add="${p.id}" ${p.stock===0 ? 'disabled' : ''}>${p.stock===0 ? 'Agotado' : 'Agregar'}</button>
      </div>
    </div>`).join('')}</div>`;
  main.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addToCart(b.dataset.add)));
}

function addToCart(id){
  const p = products.find(x => x.id === id);
  if (!p) return;
  const existing = cart.find(c => c.productId === id);
  if (existing) existing.qty += 1; else cart.push({ productId: id, name: p.name, price: p.price, qty: 1 });
  renderCart();
  showToast('Agregado al carrito');
}
function changeQty(id, delta){
  const item = cart.find(c => c.productId === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(c => c.productId !== id);
  renderCart();
}
function cartTotal(){ return cart.reduce((s,c) => s + c.price*c.qty, 0); }

function renderCart(){
  const count = cart.reduce((s,c)=>s+c.qty,0);
  const badge = document.getElementById('cartCount');
  badge.textContent = count; badge.classList.toggle('hidden', count===0);

  const body = document.getElementById('cartBody');
  const foot = document.getElementById('cartFoot');
  if (!cart.length) {
    body.innerHTML = '<div class="empty">Tu carrito está vacío.</div>';
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = cart.map(c => `
    <div class="cart-row">
      <div style="flex:1">
        <div class="cart-row-name">${esc(c.name)}</div>
        <div class="cart-row-price">${money(c.price)} c/u</div>
      </div>
      <div class="qty-ctrl">
        <button data-dec="${c.productId}">−</button>
        <span>${c.qty}</span>
        <button data-inc="${c.productId}">+</button>
      </div>
    </div>`).join('');
  body.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.inc, 1)));
  body.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.dec, -1)));

  foot.innerHTML = `
    <div class="total-row"><span>Total</span><span>${money(cartTotal())}</span></div>
    <button class="btn-primary" id="goCheckout">Continuar al pedido</button>`;
  document.getElementById('goCheckout').addEventListener('click', openCheckout);
}

function openCheckout(){
  const foot = document.getElementById('cartFoot');
  foot.innerHTML = `
    <div class="field"><label>Nombre completo</label><input id="ckName" placeholder="Tu nombre"></div>
    <div class="field"><label>Teléfono</label><input id="ckPhone" placeholder="Número de contacto"></div>
    <div class="field"><label>Dirección de entrega</label><textarea id="ckAddr" placeholder="Colonia, calle, referencia"></textarea></div>
    <div class="field">
      <label>Método de pago</label>
      <select id="ckPay">
        <option value="Efectivo contra entrega">Efectivo contra entrega</option>
        <option value="Transferencia bancaria">Transferencia bancaria</option>
      </select>
    </div>
    <div class="field"><label>Notas (opcional)</label><textarea id="ckNotes" placeholder="Instrucciones adicionales"></textarea></div>
    <div class="err" id="ckErr">Completa nombre, teléfono y dirección.</div>
    <div class="total-row"><span>Total</span><span>${money(cartTotal())}</span></div>
    <button class="btn-primary" id="ckSubmit">Enviar pedido</button>
    <button class="btn-secondary" id="ckBack">Volver al carrito</button>`;
  document.getElementById('ckBack').addEventListener('click', renderCart);
  document.getElementById('ckSubmit').addEventListener('click', submitOrder);
}

async function submitOrder(){
  const name = document.getElementById('ckName').value.trim();
  const phone = document.getElementById('ckPhone').value.trim();
  const addr = document.getElementById('ckAddr').value.trim();
  const pay = document.getElementById('ckPay').value;
  const notes = document.getElementById('ckNotes').value.trim();
  const err = document.getElementById('ckErr');
  if (!name || !phone || !addr) { err.style.display = 'block'; return; }
  err.style.display = 'none';

  const submitBtn = document.getElementById('ckSubmit');
  submitBtn.disabled = true; submitBtn.textContent = 'Enviando…';

  orders.unshift({
    id: newId(),
    customerName: name, phone, address: addr, notes,
    items: cart.map(c => ({ productId: c.productId, name: c.name, price: c.price, qty: c.qty })),
    total: cartTotal(),
    paymentMethod: pay,
    paymentStatus: 'Pendiente',
    orderStatus: 'Recibido',
    createdAt: Date.now()
  });
  saveOrders();
  cart = [];
  closeDrawer();
  renderCart();
  showToast('¡Pedido enviado! Te contactaremos pronto.');
}

/* ---------- ADMIN ---------- */
function renderAdmin(){
  const main = document.getElementById('main');
  if (!isAdmin) { main.innerHTML = '<div class="lockmsg">Acceso solo para administradores.</div>'; return; }
  main.innerHTML = `
    <div class="admin-banner"><span class="dot"></span> Panel administrativo — visible solo para tu equipo</div>
    <div class="admin-tabs">
      <button class="admin-tab ${adminTab==='productos'?'active':''}" data-atab="productos">Productos</button>
      <button class="admin-tab ${adminTab==='pedidos'?'active':''}" data-atab="pedidos">Pedidos</button>
    </div>
    <div id="adminBody"></div>`;
  main.querySelectorAll('[data-atab]').forEach(b => b.addEventListener('click', () => { adminTab = b.dataset.atab; renderAdmin(); }));
  if (adminTab === 'productos') renderAdminProducts(); else renderAdminOrders();
}

function renderAdminProducts(){
  const el = document.getElementById('adminBody');
  el.innerHTML = `
    <div class="card">
      <h3>${editingProduct ? 'Editar producto' : 'Nuevo producto'}</h3>
      <div class="row-2">
        <div class="field"><label>Nombre</label><input id="pfName"></div>
        <div class="field"><label>Precio (L)</label><input id="pfPrice" type="number" step="0.01"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Categoría</label><input id="pfCat"></div>
        <div class="field"><label>Existencias</label><input id="pfStock" type="number" step="1"></div>
      </div>
      <div class="field"><label>Descripción</label><textarea id="pfDesc"></textarea></div>
      <div class="field"><label>Foto del producto</label>
        <input type="file" id="pfFile" accept="image/*">
        <div class="mini" id="pfImgStatus"></div>
      </div>
      <div class="err" id="pfErr">El nombre y el precio son obligatorios.</div>
      <button class="btn-primary" id="pfSave">${editingProduct ? 'Guardar cambios' : 'Publicar producto'}</button>
      ${editingProduct ? '<button class="btn-secondary" id="pfCancel">Cancelar</button>' : ''}
    </div>
    <div class="card">
      <h3>Catálogo (${products.length})</h3>
      ${products.length ? products.map(p => `
        <div class="prow">
          ${p.imageUrl ? `<img src="${esc(p.imageUrl)}">` : `<div class="pimg-sm"></div>`}
          <div class="prow-info">
            <div class="n">${esc(p.name)} · ${money(p.price)}</div>
            <div class="s">${esc(p.category||'sin categoría')} · existencias: ${p.stock ?? '—'} ${p.active===false?'· inactivo':''}</div>
          </div>
          <div class="prow-actions">
            <button class="icon-btn" data-edit="${p.id}">Editar</button>
            <button class="icon-btn danger" data-del="${p.id}">Eliminar</button>
          </div>
        </div>`).join('') : '<div class="empty">Sin productos todavía.</div>'}
    </div>`;

  let pendingImageUrl = editingProduct ? editingProduct.imageUrl : null;
  if (editingProduct) {
    document.getElementById('pfName').value = editingProduct.name || '';
    document.getElementById('pfPrice').value = editingProduct.price ?? '';
    document.getElementById('pfCat').value = editingProduct.category || '';
    document.getElementById('pfStock').value = editingProduct.stock ?? '';
    document.getElementById('pfDesc').value = editingProduct.description || '';
    if (editingProduct.imageUrl) document.getElementById('pfImgStatus').textContent = 'Foto actual conservada (elige otra para reemplazar)';
  }

  document.getElementById('pfFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const status = document.getElementById('pfImgStatus');
    status.textContent = 'Cargando imagen…';
    const reader = new FileReader();
    reader.onload = () => { pendingImageUrl = reader.result; status.textContent = 'Imagen lista.'; };
    reader.onerror = () => { status.textContent = 'No se pudo cargar la imagen.'; };
    reader.readAsDataURL(file);
  });

  document.getElementById('pfSave').addEventListener('click', async () => {
    const name = document.getElementById('pfName').value.trim();
    const price = parseFloat(document.getElementById('pfPrice').value);
    const errEl = document.getElementById('pfErr');
    if (!name || isNaN(price)) { errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';
    const data = {
      name, price,
      category: document.getElementById('pfCat').value.trim(),
      stock: document.getElementById('pfStock').value === '' ? null : parseInt(document.getElementById('pfStock').value),
      description: document.getElementById('pfDesc').value.trim(),
      active: true
    };
    if (pendingImageUrl) data.imageUrl = pendingImageUrl;
    if (editingProduct) {
      Object.assign(editingProduct, data);
    } else {
      products.push({ id: newId(), ...data });
    }
    products.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    saveProducts();
    editingProduct = null;
    showToast('Producto guardado');
    renderAdminProducts();
  });

  const cancelBtn = document.getElementById('pfCancel');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { editingProduct = null; renderAdminProducts(); });

  el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
    editingProduct = products.find(p => p.id === b.dataset.edit);
    renderAdminProducts();
    window.scrollTo({top:0, behavior:'smooth'});
  }));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    products = products.filter(p => p.id !== b.dataset.del);
    saveProducts();
    showToast('Producto eliminado');
    renderAdminProducts();
  }));
}

const ORDER_STATUSES = ['Recibido','En preparación','Enviado','Entregado','Cancelado'];
const PAY_STATUSES = ['Pendiente','Pagado'];

function renderAdminOrders(){
  const el = document.getElementById('adminBody');
  if (!orders.length) { el.innerHTML = '<div class="empty">Aún no hay pedidos.</div>'; return; }
  el.innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-top">
        <div>
          <div style="font-weight:700; font-size:14px;">${esc(o.customerName||'Cliente')}</div>
          <div class="mini">${o.createdAt ? new Date(o.createdAt).toLocaleString('es-HN') : ''}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:700;">${money(o.total)}</div>
          <span class="badge ${o.paymentStatus==='Pagado'?'paid':'pend'}">${esc(o.paymentStatus||'Pendiente')}</span>
          <span class="badge prog">${esc(o.orderStatus||'Recibido')}</span>
        </div>
      </div>
      <div class="addr">📞 ${esc(o.phone||'—')} · 📍 ${esc(o.address||'—')}</div>
      ${o.notes ? `<div class="mini">Notas: ${esc(o.notes)}</div>` : ''}
      <div class="order-items">${(o.items||[]).map(i => `${i.qty}× ${esc(i.name)} (${money(i.price)})`).join(' · ')}</div>
      <div class="order-controls">
        <select data-ostatus="${o.id}">${ORDER_STATUSES.map(s => `<option ${o.orderStatus===s?'selected':''}>${s}</option>`).join('')}</select>
        <select data-pstatus="${o.id}">${PAY_STATUSES.map(s => `<option ${o.paymentStatus===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
    </div>`).join('');

  el.querySelectorAll('[data-ostatus]').forEach(s => s.addEventListener('change', () => {
    const o = orders.find(x => x.id === s.dataset.ostatus); if (o) o.orderStatus = s.value;
    saveOrders(); showToast('Actualizado');
  }));
  el.querySelectorAll('[data-pstatus]').forEach(s => s.addEventListener('change', () => {
    const o = orders.find(x => x.id === s.dataset.pstatus); if (o) o.paymentStatus = s.value;
    saveOrders(); showToast('Actualizado');
  }));
}

/* ---------- drawer ---------- */
function openDrawer(){ document.getElementById('drawer').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
document.getElementById('cartBtn').addEventListener('click', openDrawer);
document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
document.getElementById('overlay').addEventListener('click', closeDrawer);

function playIntro(){
  const overlay = document.getElementById('introOverlay');
  const env = document.getElementById('envelope');
  if (!overlay || !env) return;
  setTimeout(() => env.classList.add('open'), 450);
  setTimeout(() => overlay.classList.add('hide'), 2700);
  setTimeout(() => overlay.remove(), 3400);
}
playIntro();
init();
</script>
